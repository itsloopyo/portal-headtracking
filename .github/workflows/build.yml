name: Build

on:
  push:
    branches: ['**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'

# Read-only token. This job runs on every branch push and on pull requests, so
# it is the widest-reach workflow in the repo; it only needs to read the repo
# (checkout + submodule). Without the block the job inherits whatever the
# repository default is, which is write on repos created before the default
# changed.
permissions:
  contents: read

jobs:
  build:
    name: Build and Validate
    runs-on: windows-latest
    # The reusable release workflow defaults its own jobs to 30 minutes. This is
    # the widest-reach workflow in the repo - every branch push and every pull
    # request - so a CMake configure that stalls on a missing VS component would
    # otherwise hold a Windows runner for GitHub's six-hour default, per push.
    timeout-minutes: 30
    # release.yml already builds the version-bump commit release.ps1 lands.
    if: ${{ !startsWith(github.event.head_commit.message, 'Release v') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: recursive

      - name: Setup Visual Studio environment
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      # run-install: false - this workspace declares no conda dependencies
      # (pixi is a task runner here; the C++ toolchain and CMake come from the
      # runner image). The action's post-install `pixi list` errors on an empty
      # environment in pixi 0.70+.
      - name: Setup pixi
        uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6
        with:
          run-install: false

      # The behaviour locks for the two scripts that can silently ship a wrong
      # artifact - ModVersion.psm1, which every version read and write goes
      # through, and strip-loader-payload.ps1, which rewrites the binary we
      # redistribute - plus the licence gate over THIRD-PARTY-NOTICES.md. They
      # existed but nothing ran them, on any path: `package` does not depend on
      # `test`, and the release workflow has no test hook, so breaking any of
      # them went green here.
      - name: Test
        shell: pwsh
        run: pixi run test

      # Build + package through the SAME command a developer runs locally. All
      # build logic lives in the pixi task chain; the workflow owns none, so
      # local and CI cannot drift.
      - name: Build and package
        shell: pwsh
        run: pixi run package

      - name: Verify installer was produced
        shell: pwsh
        run: |
          $zip = Get-ChildItem release/*-installer.zip -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $zip) {
            Write-Host "::error::No installer ZIP was produced by 'pixi run package'"
            exit 1
          }
